name: Build PyStudio APK

# Runs automatically whenever a ZIP file in the repository root is added or updated
# (or when this workflow file itself is added/changed).
# Nothing to configure: no secrets, no keystore generation - the signing key lives
# inside the project ZIP so every build can update the previous one in place.
on:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pystudio-build
  cancel-in-progress: false

env:
  # Strictly increasing -> versionCode and versionName (1.0.<run number>)
  PYSTUDIO_RUN_NUMBER: ${{ github.run_number }}
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Find and unzip the Android project
        id: unzip
        shell: bash
        run: |
          set -euo pipefail
          ZIP=""
          if [ -f "PyStudio-Android-Project.zip" ]; then
            ZIP="PyStudio-Android-Project.zip"
          else
            ZIP="$(ls -1 ./*.zip 2>/dev/null | head -n 1 || true)"
          fi
          if [ -z "$ZIP" ]; then
            echo "::error::No ZIP file found in the repository root."
            exit 1
          fi
          echo "Using $ZIP"
          rm -rf "$RUNNER_TEMP/project"
          mkdir -p "$RUNNER_TEMP/project"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/project"
          SETTINGS="$(find "$RUNNER_TEMP/project" -maxdepth 3 \( -name settings.gradle.kts -o -name settings.gradle \) | head -n 1)"
          if [ -z "$SETTINGS" ]; then
            echo "::error::settings.gradle(.kts) not found inside the ZIP."
            exit 1
          fi
          DIR="$(dirname "$SETTINGS")"
          echo "Project directory: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.10 (needed by Chaquopy at build time)
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify the bundled signing key
        shell: bash
        working-directory: ${{ steps.unzip.outputs.dir }}
        run: |
          set -euo pipefail
          keytool -list -keystore app/pystudio-release.keystore -storepass pystudio-release -alias pystudio | tail -n 3

      - name: Build and sign release APK
        shell: bash
        working-directory: ${{ steps.unzip.outputs.dir }}
        run: |
          set -euo pipefail
          python3.10 --version
          gradle --no-daemon --stacktrace assembleRelease

      - name: Prepare APK
        id: apk
        shell: bash
        working-directory: ${{ steps.unzip.outputs.dir }}
        run: |
          set -euo pipefail
          SRC="$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          VERSION="1.0.${PYSTUDIO_RUN_NUMBER}"
          OUT="$GITHUB_WORKSPACE/PyStudio-v${VERSION}.apk"
          cp "$SRC" "$OUT"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$OUT" | head -n 3
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$OUT" | head -n 1
          ls -lh "$OUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PyStudio-v${{ steps.apk.outputs.version }}
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.apk.outputs.version }}
          name: PyStudio ${{ steps.apk.outputs.version }}
          make_latest: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: ${{ steps.apk.outputs.path }}
          body: |
            ## PyStudio ${{ steps.apk.outputs.version }}

            Download **PyStudio-v${{ steps.apk.outputs.version }}.apk** below and install it.
            Every build is signed with the same key, so it installs over the previous version
            without uninstalling - your files are kept.

            Build number: ${{ github.run_number }} - Commit: ${{ github.sha }}
