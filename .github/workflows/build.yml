name: Build PyStudio APK

# Put this file at .github/workflows/build.yml in the repository.
# Put PyStudio-Android.zip at the repository root (or anywhere in the repo).
# Every push that adds or changes a .zip file builds, signs and publishes a
# new GitHub Release. No secrets or manual keystore setup are required.

on:
  push:
    paths:
      - "**/*.zip"
      - "build.yml"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pystudio-apk-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.10"
  GRADLE_VERSION: "9.6.0"
  JAVA_VERSION: "21"
  COMPILE_SDK: "37"
  BUILD_TOOLS_VERSION: "36.0.0"
  MIN_SDK: "26"

jobs:
  build:
    name: Build, sign and release
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Locate the Android project ZIP
        id: archive
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE=""
          if [ -f "PyStudio-Android.zip" ]; then
            ZIP_FILE="PyStudio-Android.zip"
          else
            ZIP_FILE="$(git ls-files -- '*.zip' | head -n 1)"
          fi
          if [ -z "$ZIP_FILE" ]; then
            echo "::error::No ZIP file was found in the repository. Add PyStudio-Android.zip at the repository root."
            exit 1
          fi
          echo "Found archive: $ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract the Android project
        shell: bash
        run: |
          set -euo pipefail
          EXTRACT_DIR="$RUNNER_TEMP/pystudio-project"
          rm -rf "$EXTRACT_DIR"
          mkdir -p "$EXTRACT_DIR"
          unzip -q "${{ steps.archive.outputs.zip_file }}" -d "$EXTRACT_DIR"

          if [ -f "$EXTRACT_DIR/settings.gradle" ]; then
            PROJECT_DIR="$EXTRACT_DIR"
          elif [ -f "$EXTRACT_DIR/PyStudio/settings.gradle" ]; then
            PROJECT_DIR="$EXTRACT_DIR/PyStudio"
          else
            SETTINGS_FILE="$(find "$EXTRACT_DIR" -maxdepth 4 -name settings.gradle -type f | head -n 1)"
            if [ -z "$SETTINGS_FILE" ]; then
              echo "::error::settings.gradle was not found inside the ZIP."
              exit 1
            fi
            PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          fi

          test -f "$PROJECT_DIR/app/build.gradle" || { echo "::error::app/build.gradle is missing."; exit 1; }
          test -f "$PROJECT_DIR/signing/release.pk8" || { echo "::error::signing/release.pk8 is missing."; exit 1; }
          test -f "$PROJECT_DIR/signing/release.cert.pem" || { echo "::error::signing/release.cert.pem is missing."; exit 1; }

          echo "Project directory: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Python for Chaquopy
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Verify Python version
        shell: bash
        run: |
          python --version
          python -c 'import sys; assert sys.version_info[:2] == (3, 10), "Chaquopy requires Python 3.10 to find the Android wheels"'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-disabled: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-${COMPILE_SDK}" "build-tools;${BUILD_TOOLS_VERSION}"

      - name: Compute automatic version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          # versionCode must always increase for seamless in-place updates.
          VERSION_CODE=$((1000000 + GITHUB_RUN_NUMBER))
          VERSION_NAME="2.0.${GITHUB_RUN_NUMBER}"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "apk_name=PyStudio-${VERSION_NAME}.apk" >> "$GITHUB_OUTPUT"
          echo "Building versionName=$VERSION_NAME versionCode=$VERSION_CODE"

      - name: Build release APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          gradle :app:assembleRelease --stacktrace --warning-mode=summary
        env:
          VERSION_CODE: ${{ env.VERSION_CODE }}
          VERSION_NAME: ${{ env.VERSION_NAME }}
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8"

      - name: Zipalign and sign the APK
        id: sign
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK_ROOT" || { echo "::error::Android SDK location is not set."; exit 1; }
          BUILD_TOOLS_DIR="$(find "$SDK_ROOT/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n 1)"
          ZIPALIGN="$BUILD_TOOLS_DIR/zipalign"
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"
          test -x "$ZIPALIGN" || { echo "::error::zipalign was not found."; exit 1; }
          test -x "$APKSIGNER" || { echo "::error::apksigner was not found."; exit 1; }

          UNSIGNED_APK="$(find "$PROJECT_DIR/app/build/outputs/apk/release" -type f -name '*unsigned*.apk' | head -n 1)"
          if [ -z "$UNSIGNED_APK" ]; then
            UNSIGNED_APK="$(find "$PROJECT_DIR/app/build/outputs/apk/release" -type f -name '*.apk' | head -n 1)"
          fi
          test -n "$UNSIGNED_APK" || { echo "::error::The release APK was not produced."; exit 1; }

          OUTPUT_APK="$GITHUB_WORKSPACE/${{ steps.version.outputs.apk_name }}"
          ALIGNED_APK="$RUNNER_TEMP/pystudio-aligned.apk"
          rm -f "$ALIGNED_APK" "$OUTPUT_APK" "$OUTPUT_APK.sha256"

          "$ZIPALIGN" -P 16 -p -f 4 "$UNSIGNED_APK" "$ALIGNED_APK"
          "$APKSIGNER" sign \
            --key "$PROJECT_DIR/signing/release.pk8" \
            --cert "$PROJECT_DIR/signing/release.cert.pem" \
            --min-sdk-version "${MIN_SDK}" \
            --out "$OUTPUT_APK" \
            "$ALIGNED_APK"
          "$APKSIGNER" verify --print-certs "$OUTPUT_APK"
          ( cd "$GITHUB_WORKSPACE" && sha256sum "$(basename "$OUTPUT_APK")" > "$(basename "$OUTPUT_APK").sha256" )

          echo "APK_PATH=$OUTPUT_APK" >> "$GITHUB_ENV"
          echo "APK_SHA256_PATH=$OUTPUT_APK.sha256" >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: PyStudio-APK-build-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ env.APK_PATH }}
            ${{ env.APK_SHA256_PATH }}

      - name: Publish a new GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: PyStudio v${{ env.VERSION_NAME }}
          make_latest: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            ${{ env.APK_PATH }}
            ${{ env.APK_SHA256_PATH }}
          body: |
            ## PyStudio v${{ env.VERSION_NAME }}

            Built automatically from `${{ steps.archive.outputs.zip_file }}`
            and signed with the permanent release key bundled in the project, so it
            installs directly over any older PyStudio build.

            - Version name: `${{ env.VERSION_NAME }}`
            - Version code: `${{ env.VERSION_CODE }}`
            - Package: `com.pystudio.ide`
            - Commit: `${{ github.sha }}`
            - Built by: GitHub Actions run `${{ github.run_number }}`

            Download `${{ steps.version.outputs.apk_name }}` below and install it.
            Android may ask you to allow installs from your browser or file manager;
            that permission is only needed once.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
